name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests unitaires et build public
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          npm install --global pnpm@12.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify formatting
        run: npm run format:check
      - name: Test geometry, navigation, furniture and imports
        run: npm test
      - name: Test the plan comparison helper
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/compare_plan.py --self-test
      - name: Test the plan decision layer on the reference plan
        run: python3 scripts/derive_plan_decisions.py --self-test
      - name: Test the plan geometry extractor
        run: |
          python3 -m pip install --quiet pymupdf
          python3 scripts/extract_plan.py --self-test
      - name: Test the dimension registry
        run: python3 scripts/extract_plan_evidence.py --self-test
      - name: Test the rooms computed from walls
        run: python3 scripts/plan_faces.py --self-test
      - name: Test the project generator
        run: python3 scripts/generate_project.py --self-test
      - name: Test the printed-surface check
        run: python3 scripts/check_plan_surfaces.py --self-test
      - name: Test the site and roof check
        run: python3 scripts/check_site.py --self-test
      - name: Test the plan page tools
        run: |
          python3 -m pip install --quiet pymupdf pillow
          python3 scripts/grid_page.py --self-test
          python3 scripts/overlay_page.py --self-test
          python3 scripts/model_plan.py --self-test
          python3 scripts/wall_joins.py --self-test
      - name: Check types and build public application
        run: npm run build
      - name: Ensure personal house data is absent from publication
        run: npm run check:public
      - name: Share verified public build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-build
          path: dist/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E shard ${{ matrix.shard }}/3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm
        run: npm install --global pnpm@12.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified public build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-build
          path: dist/
      - name: Read Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium headless shell
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-shell-${{ steps.playwright.outputs.version }}
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --only-shell chromium
      - name: Install missing Linux browser dependencies
        timeout-minutes: 5
        run: |
          case "${{ runner.arch }}" in
            X64) browser_platform=linux64 ;;
            ARM64) browser_platform=linux-arm64 ;;
            *) echo "Architecture non prise en charge : ${{ runner.arch }}"; exit 1 ;;
          esac
          browser_binary=$(find "$HOME/.cache/ms-playwright" -type f -path "*/chrome-headless-shell-$browser_platform/chrome-headless-shell" -print -quit)
          if [ -z "$browser_binary" ]; then
            echo "Chromium headless shell introuvable"
            exit 1
          fi
          dependencies=$(ldd "$browser_binary")
          if printf '%s\n' "$dependencies" | grep -q 'not found'; then
            pnpm exec playwright install-deps chromium
          else
            echo "Les bibliothèques système de Chromium sont déjà disponibles"
          fi
      - name: Test public build in desktop Chromium
        run: pnpm run test:e2e:built --shard=${{ matrix.shard }}/3
      - name: Upload E2E report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    # Preserve the exact branch-protection check name; every shard must succeed.
    name: Tests, types, build et confidentialité
    if: ${{ always() }}
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require build and all E2E shards
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$BUILD_RESULT" = success && test "$E2E_RESULT" = success
