name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests unitaires et build public
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Show pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify formatting
        run: npm run format:check
      - name: Test geometry, navigation, furniture and imports
        run: npm test
      - name: Check types and build public application
        run: npm run build
      - name: Ensure personal house data is absent from publication
        run: npm run check:public
      - name: Share verified public build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-build
          path: dist/
          retention-days: 1
          if-no-files-found: error

  plan-scripts:
    name: Tests des scripts de plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install plan script dependencies once
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt
          python3 -m pip freeze | grep -iE "^(pillow|pymupdf)=="
      - name: Test the plan comparison helper
        run: |
          python3 scripts/compare_plan.py --self-test
      - name: Test the plan decision layer on the reference plan
        run: python3 scripts/derive_plan_decisions.py --self-test
      - name: Test the plan geometry extractor
        run: |
          python3 scripts/extract_plan.py --self-test
      - name: Test the derived level outline
        run: |
          python3 scripts/derive_outline.py --self-test
      - name: Test the interior doors read from swing arcs
        run: |
          python3 scripts/extract_doors.py --self-test
      - name: Test the dimension registry
        run: python3 scripts/extract_plan_evidence.py --self-test
      - name: Test the rooms computed from walls
        run: python3 scripts/plan_faces.py --self-test
      - name: Test the project generator
        run: python3 scripts/generate_project.py --self-test
      - name: Test the printed-surface check
        run: python3 scripts/check_plan_surfaces.py --self-test
      - name: Test the site and roof check
        run: python3 scripts/check_site.py --self-test
      - name: Test the plan page tools
        run: |
          python3 scripts/grid_page.py --self-test
          python3 scripts/overlay_page.py --self-test
          python3 scripts/model_plan.py --self-test
          python3 scripts/wall_joins.py --self-test

  e2e:
    name: E2E shard ${{ matrix.shard }}/3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Show pnpm version
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified public build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: public-build
          path: dist/
      - name: Read Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium headless shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-shell-${{ steps.playwright.outputs.version }}
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --only-shell chromium
      - name: Install missing Linux browser dependencies
        timeout-minutes: 5
        run: |
          case "${{ runner.arch }}" in
            X64) browser_platform=linux64 ;;
            ARM64) browser_platform=linux-arm64 ;;
            *) echo "Unsupported architecture: ${{ runner.arch }}"; exit 1 ;;
          esac
          browser_binary=$(find "$HOME/.cache/ms-playwright" -type f -path "*/chrome-headless-shell-$browser_platform/chrome-headless-shell" -print -quit)
          if [ -z "$browser_binary" ]; then
            echo "Chromium headless shell not found"
            exit 1
          fi
          dependencies=$(ldd "$browser_binary")
          if printf '%s\n' "$dependencies" | grep -q 'not found'; then
            pnpm exec playwright install-deps chromium
          else
            echo "Chromium system libraries are already available"
          fi
      - name: Test public build in desktop Chromium
        run: node scripts/e2e-shard.mjs ${{ matrix.shard }}/3

  verify:
    # Preserve the exact branch-protection check name; every shard must succeed.
    name: Tests, types, build et confidentialité
    if: ${{ always() }}
    needs: [build, plan-scripts, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require build, plan scripts and all E2E shards
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLAN_SCRIPTS_RESULT: ${{ needs.plan-scripts.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$BUILD_RESULT" = success && test "$PLAN_SCRIPTS_RESULT" = success && test "$E2E_RESULT" = success
