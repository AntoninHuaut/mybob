name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, build et confidentialité
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm
        run: npm install --global pnpm@12.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify formatting
        run: npm run format:check
      - name: Test geometry, navigation, furniture and imports
        run: npm test
      - name: Check types and build public application
        run: npm run build
      - name: Ensure personal house data is absent from publication
        run: npm run check:public
      - name: Install Chromium for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Test public build in desktop and mobile Chromium
        run: pnpm run test:e2e:built
      - name: Upload E2E report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
